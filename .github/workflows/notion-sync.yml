name: Sincronizar Issues a Notion

on:
  issues:
    types: [opened]

jobs:
  add-to-notion:
    runs-on: ubuntu-latest
    steps:
      - name: Crear página en Notion
        uses: actions/github-script@v7
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        with:
          script: |
            const issue = context.payload.issue;

            // Hacemos la petición a la API de Notion
            const response = await fetch('https://api.notion.com/v1/pages', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.NOTION_TOKEN}`,
                'Content-Type': 'application/json',
                'Notion-Version': '2022-06-28'
              },
              body: JSON.stringify({
                parent: { database_id: process.env.DATABASE_ID },
                properties: {
                  "Name": { title: [{ text: { content: issue.title } }] },
                  "URL": { url: issue.html_url },
                  "Status": { select: { name: "Open" } },
                  "Issue ID": { number: issue.number }
                }
              })
            });

            const result = await response.json();
            if (result.object === 'error') {
              console.error("Error en Notion:", result);
              process.exit(1);
            } else {
              console.log("Issue creado en Notion con éxito!");
            }
