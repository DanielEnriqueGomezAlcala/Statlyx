[project]
name = "TFG-Statlyx"
version = "0.1.0"
description = "Aplicación web interactiva para el análisis de indicadores de calidad académica universitaria."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dash==3.0.4",
    "dash-iconify==0.1.2",
    "dash-mantine-components==2.5.1",
    "docxtpl==0.16.7",
    "jinja2==3.1.2",
    "kaleido==0.2.1",
    "numpy>=2.1.0",
    "openai==2.21.0",
    "openpyxl>=3.1.5",
    "pandas==2.2.3",
    "pathlib2==2.3.7",
    "pillow==10.4.0",
    "plotly==5.18.0",
    "pydantic==2.12.5",
    "python-docx==1.1.0",
    "python-dotenv==1.2.1",
    "python-pptx==1.0.2",
    "weasyprint==60.1",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-material>=9.7.6",
    "mkdocs-section-index>=0.3",
    "mkdocstrings[python]>=1.0.3",
    "pre-commit>=4.5.1",
    "ruff>=0.15.10",
]
